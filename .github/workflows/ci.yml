name: Continuous Integration

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: Backend quality and tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run Ruff static checks
        run: python -m ruff check app scripts tests

      - name: Run unit tests
        run: python -m pytest tests -q

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build React application
        run: npm run build

  container-build:
    name: Container builds
    runs-on: ubuntu-latest
    needs:
      - backend-quality
      - frontend-build

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build API container image
        run: docker build --tag document-intelligence-hub-api:ci ./backend

      - name: Build frontend container image
        run: >
          docker build
          --build-arg VITE_API_BASE_URL=http://localhost:8001
          --tag document-intelligence-hub-frontend:ci
          ./frontend